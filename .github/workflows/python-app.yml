
name: Auto Post Bot

on:
  workflow_dispatch:
    inputs:
      publish_linkedin:
        description: "Publish one real LinkedIn post?"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: pip install -r Post/requirements.txt

      - name: Generate AI Posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python Post/Bot.py

      - name: Generate Premium Graphics
        run: python Post/Graphics.py

      - name: LinkedIn Auto Posting
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_VERSION: "202509"
          PUBLISH_LINKEDIN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_linkedin && 'true' || 'false' }}
        run: python Post/LinkedIn.py

      - name: Upload Posts and Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-social-content
          path: |
            generated_posts.json
            generated_images/
          if-no-files-found: warn
          retention-days: 7
