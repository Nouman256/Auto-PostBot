name: TechVision Social Auto Posting

on:
  schedule:
    # One run per day. 13:30 UTC = 18:30 Pakistan Standard Time (PKT).
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      publish_live:
        description: "Actually publish to Facebook and LinkedIn (otherwise dry run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: techvision-social-auto-post
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202609' }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_API_VERSION: ${{ vars.FACEBOOK_API_VERSION || 'v26.0' }}
      # Live publishing requires BOTH the manual confirmation and repository variables.
      PUBLISH_LINKEDIN: ${{ ((github.event_name == 'schedule' || inputs.publish_live == true) && vars.PUBLISH_LINKEDIN == 'true') && 'true' || 'false' }}
      PUBLISH_FACEBOOK: ${{ ((github.event_name == 'schedule' || inputs.publish_live == true) && vars.PUBLISH_FACEBOOK == 'true') && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prevent a second successful publishing run on the same UTC date
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path("post_history.json")
          if path.exists():
              try:
                  history = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  history = []
              today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              already_published = [
                  item for item in history if isinstance(item, dict)
                  and item.get("run_date") == today and item.get("mode") == "published"
              ]
              if already_published:
                  raise SystemExit(f"A successful live run is already recorded for {today} UTC. Stopping to avoid duplicate posts.")
          print("No successful live run recorded for today's UTC date.")
          PY

      - name: Generate two original posts
        run: python generate_posts.py

      - name: Generate four platform-specific images
        run: python generate_images.py

      - name: Validate assets and show preview
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          posts = json.loads(Path("generated_posts.json").read_text(encoding="utf-8"))
          assert len(posts) == 2, "Expected technical + engagement posts"
          for p in posts:
              assert p["category"] in {"technical", "engagement"}
              for key in ("image_path", "facebook_image_path"):
                  assert Path(p[key]).is_file(), f"Missing {key}: {p[key]}"
              print("\\n---", p["category"], "---")
              print("Title:", p["title"])
              print("\\nLinkedIn caption:\\n", p["content"])
              print("\\nFacebook caption:\\n", p["facebook_content"])
              print("LinkedIn image:", p["image_path"])
              print("Facebook image:", p["facebook_image_path"])
          PY

      - name: LinkedIn publish or dry run
        run: python publish_linkedin.py

      - name: Facebook publish or dry run
        run: python publish_facebook.py

      - name: Record daily post history
        run: python record_history.py

      - name: Commit history only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update social post history [skip ci]"
            git push
          fi
